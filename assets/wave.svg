<svg
  width="1200"
  height="100"
  viewBox="0 0 1200 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .wave {
      animation: moveWave 8s linear infinite;
    }

    .wave-slow {
      animation: moveWave 12s linear infinite reverse;
    }

    @keyframes moveWave {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-1200px);
      }
    }
  </style>

  <defs>
    <path
      id="wave"
      d="
        M0 45
        C75 20 150 20 225 45
        C300 70 375 70 450 45
        C525 20 600 20 675 45
        C750 70 825 70 900 45
        C975 20 1050 20 1125 45
        C1160 57 1180 57 1200 45
        V100
        H0
        Z
      "
    />
  </defs>

  <!-- Main wave -->
  <g class="wave">
    <use href="#wave" fill="#fffb00" opacity="0.9" />
    <use href="#wave" x="1200" fill="#fffb00" opacity="0.9" />
  </g>

  <!-- Secondary wave -->
  <g class="wave-slow">
    <use href="#wave" y="10" fill="#fffb00" opacity="0.35" />
    <use href="#wave" x="1200" y="10" fill="#fffb00" opacity="0.35" />
  </g>
</svg>