name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mfranmartins
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%23F5FF8A&color_dots=%23161B22%2C%2330363D%2C%236E7B00%2C%23A6B800%2C%23FFFB00

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}